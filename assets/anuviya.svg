<svg xmlns="http://www.w3.org/2000/svg" width="640" height="412" viewBox="0 0 640 412" fill="none"><defs><linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#58a6ff" stop-opacity=".18"/><stop offset=".45" stop-color="#58a6ff" stop-opacity="0"/></linearGradient></defs><rect x=".5" y=".5" width="639" height="411" rx="12" fill="#161b22" stroke="#58a6ff" stroke-opacity="0.5"/><rect x=".5" y=".5" width="639" height="411" rx="12" fill="url(#glow)"/><path d="M29 27 l-5 5 l5 5 M35 27 l5 5 l-5 5" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="52" y="43" font-family="Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#58a6ff" text-anchor="start" >Anuviya</text><g transform="translate(470 24)"><rect x="0" y="0" width="146" height="26" rx="13.0" fill="#3fb950" fill-opacity=".15" stroke="#3fb950" stroke-opacity=".4"/><text x="12" y="17.2" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="500" fill="#3fb950" text-anchor="start" >Language-agnostic</text></g><g transform="translate(359 24)"><rect x="0" y="0" width="103" height="26" rx="13.0" fill="#f0883e" fill-opacity=".15" stroke="#f0883e" stroke-opacity=".4"/><text x="12" y="17.2" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="500" fill="#f0883e" text-anchor="start" >In progress</text></g><text x="24" y="84" font-family="Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#c9d1d9" text-anchor="start" >Understand code, build better.</text><text x="24" y="110" font-family="Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8b949e" text-anchor="start" >A code analysis and visualization tool that maps dependencies and</text><text x="24" y="130" font-family="Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8b949e" text-anchor="start" >structure, and shows how classes and methods connect. Now language-</text><text x="24" y="150" font-family="Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#8b949e" text-anchor="start" >agnostic, so it is not tied to a single stack.</text><rect x="24" y="176" width="28" height="28" rx="8" fill="#58a6ff" fill-opacity=".15"/><g transform="translate(24 176)"><path d="M8 19 L14 9 L20 19" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="8" cy="19" r="2.6" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="#161b22"/><circle cx="14" cy="9" r="2.6" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="#161b22"/><circle cx="20" cy="19" r="2.6" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="#161b22"/></g><text x="62" y="188" font-family="Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#c9d1d9" text-anchor="start" >Dependency analysis</text><text x="62" y="206" font-family="Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#8b949e" text-anchor="start" >Maps code dependencies and structure</text><rect x="24" y="230" width="28" height="28" rx="8" fill="#bc8cff" fill-opacity=".15"/><g transform="translate(24 230)"><path d="M9 21 V16 M14 21 V11 M19 21 V7" stroke="#bc8cff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="62" y="242" font-family="Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#c9d1d9" text-anchor="start" >Visual relationships</text><text x="62" y="260" font-family="Inter,-apple-system,'Segoe UI',Roboto,Helve